function clean(t){t=t.replace(/```html/g,'').replace(/```/g,'').trim();let s=t.indexOf('<!DOCTYPE');if(s>-1)t=t.slice(s);return t;}
function dl(){let h=localStorage.getItem('ul');if(!h){alert('Build something first');return;}let b=new Blob([h],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ucan-app.html';a.click();}
