<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAWA UCAN - Global AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,sans-serif}
body{background:#fff;color:#111;height:100vh;display:flex;flex-direction:column}
header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:19px;letter-spacing:1px}
.logo span{font-size:13px;color:#888;display:block;letter-spacing:3px}
.pill{font-size:12px;background:#f0f0f0;padding:6px 10px;border-radius:20px;color:#555}
#chat{flex:1;overflow-y:auto;padding:20px;max-width:800px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{max-width:90%;padding:14px 16px;border-radius:18px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.user{background:#111;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#f5f5f5;align-self:flex-start;border-bottom-left-radius:4px}
.inputWrap{max-width:800px;width:100%;margin:0 auto;padding:12px 16px 16px}
.inputBox{display:flex;gap:10px;align-items:center;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:28px;padding:6px 6px 6px 18px}
.inputBox input{flex:1;border:none;background:transparent;outline:none;font-size:15px;padding:10px 0}
.inputBox button{width:44px;height:44px;border-radius:50%;border:none;background:#111;color:#fff;font-size:18px;cursor:pointer}
footer{text-align:center;font-size:11px;color:#aaa;padding-bottom:10px}
</style>
</head>
<body>

<header>
<div class="logo"><div style="font-size:26px">🧠</div><div><b>HAWA UCAN</b><span>GLOBAL AI</span></div></div>
<div class="pill">v1.2 • Global</div>
</header>

<div id="chat">
<div class="msg ai">Hello! I'm HAWA UCAN — a global AI for creators.

Ask me anything: research, coding, writing, video ideas, image prompts, business, or study. I will answer directly in English.</div>
</div>

<div class="inputWrap">
<div class="inputBox">
<input id="inp" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') send()">
<button onclick="send()">↑</button>
</div>
</div>
<footer>HAWA UCAN v1.2 • U CAN DO ANYTHING</footer>

<script>
let chat=document.getElementById('chat');
let inp=document.getElementById('inp');

function addMsg(t,who){
  let d=document.createElement('div');
  d.className='msg '+who; d.innerText=t;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}

function getReply(q){
  let s=q.toLowerCase();
  if(s.includes('who are you')||s.includes('your name')||s.includes('what are you')){
    return "I'm HAWA UCAN — a global AI assistant for creators.\n\nI can help with research, coding, writing, video scripts, image prompts, business ideas, and learning.\n\nWhat do you want to create today?";
  }
  if(s.includes('python')||s.includes('code')||s.includes('javascript')||s.includes('html')){
    return "Here is a clean, working example:\n\nPython — Data Scraping:\n\nimport requests\nfrom bs4 import BeautifulSoup\n\nurl = 'https://example.com'\nhtml = requests.get(url).text\nsoup = BeautifulSoup(html, 'html.parser')\nfor tag in soup.find_all('h2'):\n    print(tag.text)\n\nTell me your exact website or task, and I will write the exact code for it.";
  }
  if(s.includes('quantum')||s.includes('transformer')||s.includes('research')||s.includes('paper')){
    return "Quantum Transformer Models — Explained Simply:\n\n1. A normal Transformer uses attention to understand text.\n2. A Quantum Transformer uses quantum circuits and qubits to process many possibilities at once.\n3. It is still in research — IBM and Google are working on it.\n4. It could be faster for complex problems like drug discovery and optimization.\n\nDo you want a summary, a presentation outline, or a full paper explanation?";
  }
  if(s.includes('image')||s.includes('prompt')||s.includes('picture')||s.includes('thumbnail')){
    return "Best Image Prompt for you:\n\n\"Cinematic studio portrait, soft neon light, high detail, professional photography, 4k\"\n\nTell me what image you want — logo, thumbnail, poster, or portrait — and I will create a perfect prompt for it.";
  }
  if(s.includes('video')||s.includes('script')||s.includes('youtube')||s.includes('reel')){
    return "Video Script — 30 Second Hook Formula:\n\n0-3s: Start with a strong hook — \"Stop doing this mistake...\"\n3-15s: Show the problem\n15-25s: Show the solution\n25-30s: Call to action — \"Follow for Part 2\"\n\nTell me your video topic and I will write the full script.";
  }
  if(s.includes('business')||s.includes('startup')||s.includes('earn')||s.includes('money')){
    return "3 Business Ideas for Creators in 2026:\n\n1. AI Content Studio — Make videos/posts for small brands.\n2. Digital Products — Sell templates, prompts, and courses.\n3. Automation Service — Help businesses automate with AI.\n\nWhich one interests you? I can make a full plan for it.";
  }
  if(s.includes('hello')||s.includes('hi')||s.includes('hey')){
    return "Hello! How are you today?\n\nWhat can I help you with — coding, research, writing, or an idea?";
  }
  if(s.includes('motivat')||s.includes('tired')||s.includes('sad')){
    return "You are already doing more than most people. You built a live website — that takes courage.\n\nJust do one small task today, for 10 minutes. Momentum will come. You can do anything.";
  }
  if(s.includes('3d')||s.includes('turbine')||s.includes('model')){
    return "3D Turbine Model — Plan:\n\n- 3 blades, metallic finish\n- Central hub + rotating shaft\n- Export as OBJ / GLB for Blender or Three.js\n\nDo you want Blender steps or Three.js code?";
  }
  return "Good question.\n\nTo give you the best answer, tell me:\n1. Do you want a summary, a guide, or code?\n2. What is it for — project, video, or learning?\n\nTell me and I will answer directly.";
}

function send(){
  let t=inp.value.trim(); if(!t) return;
  addMsg(t,'user'); inp.value='';
  // NO fake loading, NO "searching" message - direct answer
  addMsg(getReply(t),'ai');
}
</script>
</body>
</html>
